name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Preparar web (carpeta www)
        run: npm run build:web

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Permiso de camara
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.CAMERA" />' "$M"
          sed -i '/<\/manifest>/i \    <uses-feature android:name="android.hardware.camera" android:required="false" />' "$M"
          grep -n "CAMERA\|camera" "$M"

      - name: Icono de la app (si falla, usa el icono por defecto)
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0f766e'

      - name: Sincronizar web
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: manuales-rapidos-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Manuales Rapidos APK ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
